[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mes-apml-loss-preview"
version = "0.2.0"
description = "Unpublished educational implementation of original APML and MES objectives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["numpy>=1.24", "matplotlib>=3.7"]
movie = ["numpy>=1.24", "matplotlib>=3.7", "torchvision>=0.16", "Pillow>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
