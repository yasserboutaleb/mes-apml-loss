name: MES-loss offline verification

on:
  push:
    branches:
      - "review/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and torchvision
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project with test and video extras
        run: python -m pip install -e ".[dev,movie]"
      - name: Mathematical tests and offline video smoke tests
        run: python scripts/reproduce.py check
      - name: Minimal educational training
        run: python scripts/reproduce.py quickstart
      - name: Regenerate analytic and synthetic figures
        run: python scripts/reproduce.py figures
      - name: Inspect figure manifest
        run: |
          test -f figures/manifest.json
          python -c "import json; m=json.load(open('figures/manifest.json')); assert m['status']=='synthetic_or_analytic_only'"
      # No official MNIST test set or CUB/Cars data is downloaded in CI.
